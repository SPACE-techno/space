<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space — Technology & Innovation</title>
    <meta name="description" content="Space — Technology & Innovation. Choose your language to explore our digital solutions, professional websites, and cutting-edge development." />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://spacetechn.com/" />

    <!-- Hreflang — root as x-default, pointing to language versions -->
    <link rel="alternate" hreflang="pt-BR" href="https://spacetechn.com/pt/" />
    <link rel="alternate" hreflang="en" href="https://spacetechn.com/en/" />
    <link rel="alternate" hreflang="x-default" href="https://spacetechn.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Space — Technology & Innovation" />
    <meta property="og:description" content="Premium digital solutions, web development, and innovation. Choose your language." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spacetechn.com/" />
    <meta property="og:image" content="https://spacetechn.com/images/og-image-root.jpg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Space — Technology & Innovation" />
    <meta name="twitter:description" content="Choose your language and explore the Space experience." />

    <!-- Fonts — Space Grotesk, same as main site -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Favicon — reuse existing -->
    <link rel="icon" type="image/png" href="images/spacelogo.png" />
    <link rel="apple-touch-icon" href="images/spacelogo.png" />

    <!-- JSON‑LD: minimal Organization for the root -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "Space",
            "url": "https://spacetechn.com",
            "logo": "https://spacetechn.com/images/spacelogo.png",
            "description": "Technology & Innovation — Web Development, Software, AI, Digital Solutions.",
            "sameAs": [
                "https://github.com/SPACE-techno",
                "https://linkedin.com/company/spacetechn",
                "https://instagram.com/spacetech.ltda"
            ]
        }
    </script>

    <style>
        /* ── reset & base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --black: #000000;
            --white: #ffffff;
            --font: 'Space Grotesk', 'Inter', 'Helvetica Neue', sans-serif;
            --transition-smooth: 550ms cubic-bezier(0.22, 1, 0.36, 1);
            --transition-fast: 250ms cubic-bezier(0.22, 1, 0.36, 1);
            --max-width: 1200px;
            --spacing: clamp(1.5rem, 5vw, 4rem);
            --radius: 12px;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: var(--black);
            color: var(--white);
            font-size: 16px;
        }

        body {
            font-family: var(--font);
            font-weight: 400;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: var(--black);
            cursor: default;
        }

        /* ── starfield canvas ── */
        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: var(--black);
        }

        /* ── main container ── */
        .gateway {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: var(--max-width);
            padding: var(--spacing);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(24px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── logo ── */
        .gateway-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 0.4rem;
            text-decoration: none;
        }

        .gateway-logo img {
            width: clamp(56px, 8vw, 96px);
            height: auto;
            display: block;
            object-fit: contain;
        }

        .gateway-logo span {
            font-size: clamp(2.8rem, 7vw, 6rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--white);
            line-height: 1;
        }

        /* ── tagline ── */
        .gateway-tagline {
            font-size: clamp(0.95rem, 1.6vw, 1.5rem);
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-top: -0.2rem;
            margin-bottom: clamp(2rem, 6vw, 4.5rem);
        }

        /* ── language selector ── */
        .language-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(1.2rem, 3vw, 3rem);
            width: 100%;
            max-width: 600px;
        }

        .lang-card {
            flex: 1 1 180px;
            min-width: 160px;
            max-width: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(1.8rem, 3.5vw, 3rem) clamp(1.2rem, 2vw, 2.2rem);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--white);
            transition: all var(--transition-fast);
            position: relative;
            gap: 0.4rem;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .lang-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            border: 1px solid transparent;
            transition: border-color var(--transition-fast);
            pointer-events: none;
        }

        .lang-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6);
        }

        .lang-card:hover::after {
            border-color: rgba(255, 255, 255, 0.5);
        }

        .lang-card:focus-visible {
            outline: 2px solid var(--white);
            outline-offset: 4px;
        }

        .lang-card .lang-name {
            font-size: clamp(1.4rem, 2.4vw, 2.2rem);
            font-weight: 600;
            letter-spacing: 0.02em;
            line-height: 1.2;
        }

        .lang-card .lang-sub {
            font-size: clamp(0.7rem, 0.9vw, 0.85rem);
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: rgba(255, 255, 255, 0.4);
            transition: color var(--transition-fast);
        }

        .lang-card:hover .lang-sub {
            color: rgba(255, 255, 255, 0.7);
        }

        /* small arrow indicator */
        .lang-card .lang-arrow {
            display: inline-block;
            font-size: 1.2rem;
            margin-top: 0.2rem;
            opacity: 0;
            transform: translateX(-6px);
            transition: all var(--transition-fast);
        }

        .lang-card:hover .lang-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        /* ── subtle divider / ornament ── */
        .gateway-divider {
            width: 1px;
            height: 48px;
            background: rgba(255, 255, 255, 0.08);
            margin: 0.2rem 0 0.6rem;
        }

        /* ── footer note ── */
        .gateway-footer {
            margin-top: clamp(2.4rem, 5vw, 4.5rem);
            font-size: clamp(0.6rem, 0.8vw, 0.75rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.2);
        }

        /* ── responsive ── */
        @media (max-width: 640px) {
            .language-grid {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }

            .lang-card {
                flex: 0 1 auto;
                width: 100%;
                max-width: 320px;
                padding: 1.4rem 1.8rem;
                flex-direction: row;
                justify-content: center;
                gap: 0.8rem;
            }

            .lang-card .lang-arrow {
                display: inline-block;
                opacity: 0.4;
                transform: none;
                font-size: 1rem;
            }

            .lang-card:hover .lang-arrow {
                opacity: 0.8;
                transform: none;
            }

            .lang-card .lang-sub {
                display: none;
            }

            .gateway-divider {
                height: 24px;
            }

            .gateway-footer {
                margin-top: 2rem;
            }
        }

        @media (max-width: 400px) {
            .gateway-logo img {
                width: 44px;
            }
            .gateway-logo span {
                font-size: 2.2rem;
            }
            .gateway-tagline {
                font-size: 0.75rem;
                letter-spacing: 0.2em;
            }
            .lang-card {
                padding: 1rem 1.2rem;
            }
            .lang-card .lang-name {
                font-size: 1.1rem;
            }
        }

        /* ── reduce motion ── */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .gateway {
                opacity: 1;
                transform: none;
                animation: none;
            }
            .lang-card {
                transition: none;
            }
            .lang-card:hover {
                transform: none;
            }
        }

        /* ── cursor: subtle dot for desktop ── */
        @media (min-width: 769px) {
            .cursor-dot {
                position: fixed;
                width: 10px;
                height: 10px;
                background: rgba(255, 255, 255, 0.2);
                border-radius: 50%;
                pointer-events: none;
                z-index: 9999;
                transform: translate(-50%, -50%);
                transition: width 0.3s, height 0.3s, background 0.3s;
                mix-blend-mode: difference;
                will-change: transform;
                display: none;
            }
            .cursor-dot.visible {
                display: block;
            }
            .cursor-dot.hover {
                width: 32px;
                height: 32px;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.15);
            }
        }
    </style>
</head>
<body>

    <!-- Starfield Canvas -->
    <canvas id="starCanvas" aria-hidden="true"></canvas>

    <!-- Custom cursor dot (desktop only) -->
    <div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>

    <!-- ─── MAIN GATEWAY ─── -->
    <main class="gateway" role="main" aria-label="Language selection">

        <!-- Logo + Brand -->
        <a href="/" class="gateway-logo" aria-label="Space — home">
            <img src="images/spacelogo.png" alt="Space logo" width="96" height="96" />
            <span>SPACE</span>
        </a>

        <p class="gateway-tagline">Technology &amp; Innovation</p>

        <!-- Language Cards -->
        <div class="language-grid" role="list">

            <!-- Português -->
            <a href="https://spacetechn.com/pt/" class="lang-card" role="listitem" hreflang="pt-BR" aria-label="Português — versão em português do Brasil">
                <span class="lang-name">Português</span>
                <span class="lang-sub">Brasil</span>
                <span class="lang-arrow" aria-hidden="true">→</span>
            </a>

            <!-- English -->
            <a href="https://spacetechn.com/en/" class="lang-card" role="listitem" hreflang="en" aria-label="English — English version">
                <span class="lang-name">English</span>
                <span class="lang-sub">International</span>
                <span class="lang-arrow" aria-hidden="true">→</span>
            </a>

        </div>

        <!-- Divider ornament -->
        <div class="gateway-divider" aria-hidden="true"></div>

        <!-- Footer -->
        <p class="gateway-footer">Choose your experience</p>

    </main>


    <!-- ─── SCRIPTS ─── -->
    <script>
        (function() {
            'use strict';

            // ── Starfield (reused from main site, light & performant) ──
            const canvas = document.getElementById('starCanvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                let stars = [];
                let w, h;
                const STAR_COUNT = 100;
                let mouse = { x: 0, y: 0 };
                let targetMouse = { x: 0, y: 0 };

                function resize() {
                    const dpr = window.devicePixelRatio || 1;
                    w = window.innerWidth;
                    h = window.innerHeight;
                    canvas.width = w * dpr;
                    canvas.height = h * dpr;
                    canvas.style.width = w + 'px';
                    canvas.style.height = h + 'px';
                    ctx.scale(dpr, dpr);
                }

                function createStars() {
                    stars = [];
                    for (let i = 0; i < STAR_COUNT; i++) {
                        stars.push({
                            baseX: Math.random() * w,
                            baseY: Math.random() * h,
                            radius: Math.random() * 1.4 + 0.3,
                            phase: Math.random() * Math.PI * 2,
                            speed: 0.015 + Math.random() * 0.035,
                            influence: 0.004 + Math.random() * 0.018
                        });
                    }
                }

                function animate() {
                    // smooth mouse
                    mouse.x += (targetMouse.x - mouse.x) * 0.06;
                    mouse.y += (targetMouse.y - mouse.y) * 0.06;

                    ctx.clearRect(0, 0, w, h);

                    const now = performance.now() * 0.001;
                    const cx = w / 2;
                    const cy = h / 2;
                    const dx = mouse.x - cx;
                    const dy = mouse.y - cy;

                    for (const star of stars) {
                        const offsetX = dx * star.influence;
                        const offsetY = dy * star.influence;
                        const x = star.baseX + offsetX;
                        const y = star.baseY + offsetY;
                        const twinkle = 0.35 + 0.65 * Math.sin(now * star.speed * 10 + star.phase);
                        const alpha = 0.2 + twinkle * 0.8;

                        ctx.beginPath();
                        ctx.arc(x, y, star.radius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                        ctx.fill();
                    }

                    requestAnimationFrame(animate);
                }

                function onMouseMove(e) {
                    targetMouse.x = e.clientX;
                    targetMouse.y = e.clientY;
                }

                window.addEventListener('resize', () => {
                    resize();
                    createStars();
                });

                window.addEventListener('mousemove', onMouseMove, { passive: true });

                resize();
                createStars();
                animate();
            }

            // ── Custom cursor (desktop only) ──
            const dot = document.getElementById('cursorDot');
            if (dot && window.matchMedia('(min-width: 769px)').matches) {
                let mx = 0,
                    my = 0,
                    cx = 0,
                    cy = 0;

                document.addEventListener('mousemove', (e) => {
                    mx = e.clientX;
                    my = e.clientY;
                    if (!dot.classList.contains('visible')) {
                        dot.classList.add('visible');
                    }
                });

                function animateCursor() {
                    cx += (mx - cx) * 0.18;
                    cy += (my - cy) * 0.18;
                    dot.style.left = cx + 'px';
                    dot.style.top = cy + 'px';
                    requestAnimationFrame(animateCursor);
                }

                // hover effect on interactive elements
                const interactives = '.lang-card, .gateway-logo, a, button';
                document.addEventListener('mouseover', (e) => {
                    if (e.target.closest(interactives)) {
                        dot.classList.add('hover');
                    } else {
                        dot.classList.remove('hover');
                    }
                });

                document.addEventListener('mouseout', () => {
                    dot.classList.remove('hover');
                });

                animateCursor();
            }

            // ── Keyboard / accessibility: ensure focus rings are visible ──
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Tab') {
                    document.body.classList.add('keyboard-nav');
                }
            });
            document.addEventListener('mousedown', () => {
                document.body.classList.remove('keyboard-nav');
            });

        })();
    </script>

    <!-- small style for keyboard focus -->
    <style>
        .keyboard-nav .lang-card:focus {
            outline: 2px solid #fff;
            outline-offset: 4px;
        }
    </style>

</body>
</html>
